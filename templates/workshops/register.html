{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow border-0 p-4">
            <h2 class="fw-bold mb-2">Workshop Registration</h2>
            <h5 class="text-primary mb-3">{{ workshop.title }}</h5>
            <p class="text-muted small mb-4"><strong>Speaker:</strong> {{ workshop.speaker }} | <strong>Date:</strong> {{ workshop.date }}</p>

            <form method="POST">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-dark w-100 mt-3 py-2">Confirm & Send Email</button>
            </form>

            <div class="text-center mt-3">
                <a href="{% url 'workshop_list' %}" class="text-decoration-none text-muted small">← Back to Workshops</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
